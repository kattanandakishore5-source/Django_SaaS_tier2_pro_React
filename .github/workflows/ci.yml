name: Django SaaS CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  test-backend:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v3
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.11'
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
    - name: Run Django Tests
      env:
        SECRET_KEY: 'ci-test-key-not-for-production'
        DEBUG: 'True'
        DB_ENGINE: 'django.db.backends.sqlite3'
      run: |
        python manage.py test

  test-frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./frontend
    steps:
    - uses: actions/checkout@v3
    - name: Set up Node
      uses: actions/setup-node@v3
      with:
        node-version: '20'
        cache: 'npm'
        cache-dependency-path: './frontend/package-lock.json'
    - name: Install dependencies
      run: npm ci
    - name: Run Linter
      run: npx oxlint@latest
    - name: Run Tests
      run: npm run test
    - name: Run Build
      run: npm run build

  deploy-check:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v3
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.11'
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
    - name: Django Deploy Check
      env:
        SECRET_KEY: 'ci-test-key-not-for-production-but-valid-length-and-complex-for-check'
        DEBUG: 'False'
        DB_ENGINE: 'django.db.backends.sqlite3'
        DB_PASSWORD: 'mock'
      run: |
        python manage.py check --deploy
